plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace "com.android.launcher3.flags"
    sourceSets {
        main {
            java.srcDirs = ['src']
        }
    }
}

addFrameworkJar('framework-15-qpr2.jar')
compileOnlyCommonJars()
dependencies {
    implementation 'androidx.dynamicanimation:dynamicanimation-ktx:1.1.0'
    implementation projects.wmshell
}
