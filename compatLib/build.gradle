plugins {
    id 'com.android.library'
}

android {
    namespace "app.lawnchair.compatlib"

    buildFeatures {
        aidl true
    }

    sourceSets {
        main {
            aidl.srcDirs = ['src/main/java']
        }
    }
}

addFrameworkJar('framework-15.jar')
addFrameworkJar('framework-15-qpr2.jar')
addFrameworkJar('WindowManager-Shell-15.jar')
