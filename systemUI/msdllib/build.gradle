apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace = "com.google.android.msdl"

    sourceSets {
        main {
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            manifest.srcFile 'AndroidManifest.xml'
        }
        androidTest {
            java.srcDirs = ["tests/src"]
            manifest.srcFile 'tests/AndroidManifest.xml'
        }
    }
}
